server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # -------------------------------------------------
    # FRONTEND (React SPA)
    # -------------------------------------------------
    location / {
        try_files $uri /index.html;
    }

    # -------------------------------------------------
    # API → backend
    # -------------------------------------------------
    location /api/ {
        proxy_pass http://mindlink-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # -------------------------------------------------
    # STATIC FILES FROM BACKEND
    # These must be accessible from LAN devices.
    # -------------------------------------------------

    # Uploads (photos, attachments)
    location /uploads/ {
        proxy_pass http://mindlink-backend:8000/uploads/;
    }

    # Profiles (profile images, stored avatars)
    location /profiles/ {
        proxy_pass http://mindlink-backend:8000/profiles/;
    }
}